<div class="background d-flex align-items-center">
  <div class="container-md">
    <div class="row align-items-center">
      <div class="col-md-5 mx-5 d-sm-none d-md-block">
        <h3 class="text-light">Welcome to Issue Tracker</h3>
        <br />
        <p>
          This platform interacts with JIRA to push issues as bugs to the
          associated projects and report issues with the software.
        </p>
      </div>
      <div class="col-md-5">
        <h3 class="text-light">Sign Up In IssueTracker</h3>
        <div class="card mt-4">
          <div class="card-body">
            <div *ngIf="error" class="alert alert-danger p-2" role="alert">
              {{ error }}
            </div>
            <form [formGroup]="signup" (ngSubmit)="onSubmit()">
              <div class="row">
                <div class="col-md-6">
                  <mdb-form-control class="mt-2">
                    <input
                      mdbInput
                      formControlName="first_name"
                      type="text"
                      id="first_name"
                      class="form-control"
                    />
                    <label mdbLabel class="form-label" for="first_name"
                      >First Name</label
                    >
                  </mdb-form-control>
                </div>
                <div class="col-md-6">
                  <mdb-form-control class="mt-2">
                    <input
                      mdbInput
                      formControlName="last_name"
                      type="text"
                      id="last_name"
                      class="form-control"
                    />
                    <label mdbLabel class="form-label" for="last_name"
                      >Last Name</label
                    >
                  </mdb-form-control>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6">
                  <mdb-form-control class="mt-2">
                    <input
                      mdbInput
                      formControlName="organisation"
                      type="text"
                      id="organisation"
                      class="form-control"
                    />
                    <label mdbLabel class="form-label" for="organisation"
                      >Organisation</label
                    >
                  </mdb-form-control>
                </div>
                <div class="col-md-6">
                  <mdb-form-control class="mt-2">
                    <input
                      mdbInput
                      formControlName="representative"
                      type="text"
                      id="representative"
                      class="form-control"
                    />
                    <label mdbLabel class="form-label" for="representative"
                      >Representative</label
                    >
                  </mdb-form-control>
                </div>
              </div>

              <button
              [disabled]="!signup.valid"
                class="btn login-button btn-block btn-rounded mt-2"
                type="submit"
              >
                <span *ngIf="loading">
                  <span
                    class="spinner-border spinner-border-sm"
                    role="status"
                    aria-hidden="true"
                  ></span>
                  Loading...
                </span>
                <span *ngIf="!loading">Sign Up</span>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
