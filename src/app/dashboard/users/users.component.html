<div class="d-flex justify-content-end">
  <button class="btn btn-primary" (click)="inviteModal(myModal)">
    Invite User
  </button>
</div>
<ng-template #myModal>
  <div class="modal-header">
    <h4 class="modal-title">Create An Issue</h4>
    <a role="button" class="close" aria-label="Close" (click)="closeModal()">
      <i class="fa fa-times" aria-hidden="true"></i>
    </a>
  </div>
  <div class="modal-body">
    <form [formGroup]="myForm" (ngSubmit)="inviteUser()">
      <div class="form-group p-3">
        <label for="email">Email</label>
        <input
          type="text"
          id="email"
          class="form-control"
          formControlName="email"
        />
      </div>
      <div class="form-group p-3">
        <label for="project">Select Project</label>
        <select id="project"  class="form-select" aria-label="Default select example" formControlName="project">
          <option value="">Choose...</option>
          <option *ngFor="let project of projects" [value]="project.id">{{project.name}}</option>
        </select>
      </div>
      <div class="d-flex justify-content-end p-3 mt-2">
        <button
          type="button"
          class="btn btn-dark-outline mx-3"
          (click)="closeModal()"
        >
          Cancel
        </button>
        <button type="submit" class="btn btn-primary">
          <span *ngIf="inviteLoading">
            <span
              class="spinner-border spinner-border-sm"
              role="status"
              aria-hidden="true"
            ></span>
            Loading...
          </span>
          <span *ngIf="!inviteLoading">Invite</span>
        </button>
      </div>
    </form>
  </div>
</ng-template>
<div class="card p-3 mb-2 text-center"><h3>Users</h3></div>
<app-user-table [data]="users"></app-user-table>
