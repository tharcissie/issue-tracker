<div class="card p-3">
  <div class="card-body">
    <div class="row">
      <div class="col-sm-7">
        <h3>{{ number }}</h3>
        <h5>{{ label }}</h5>
      </div>
      <div class="col-sm-5 d-flex justify-content-end">
        <div class="cardIcon d-flex align-items-center justify-content-center">
          <i [class]="icon"></i>
        </div>
      </div>
    </div>
  </div>
</div>
